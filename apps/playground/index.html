<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAC Web Playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- File Manager Sidebar -->
      <div id="file-manager">
        <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center;">
          <h3>Workspace</h3>
          <button id="btn-import-github" style="font-size: 10px; padding: 2px 6px; cursor: pointer;">Import GitHub</button>
        </div>
        <div class="sidebar-section-title" style="display:none;">FILES</div>
        <ul id="file-list"></ul>
      </div>
      
      <!-- Main Content Area -->
      <div id="main-content">
        <!-- Toolbar (Top) -->
        <div id="toolbar">
          <div class="toolbar-left">
            <span id="active-filename"></span>
          </div>
          <div class="toolbar-right">
            <button id="btn-share" title="Copy shortened URL to clipboard">Share</button>
          </div>
        </div>
        
        <!-- Workspace Split Pane -->
        <div id="workspace-pane">
          <!-- Visualizer Container (Will hold only the SVG Canvas after detachment) -->
          <div id="visualizer-container"></div>

          <!-- Resizer handle between visualizer and right pane -->
          <div id="pane-resizer" title="Drag to resize panes"></div>
          
          <!-- Right Pane (Tabs) -->
          <div id="right-pane">
            <div id="properties-header" style="display: flex; justify-content: flex-end; padding: 10px; border-bottom: 1px solid var(--border); background-color: var(--bg-sidebar); height: 35px; align-items: center;">
               <div style="display: flex; align-items: center;">
                 <label class="toggle-switch">
                   <input type="checkbox" id="toggle-json" />
                   <span class="toggle-slider"></span>
                 </label>
                 <span style="font-size: 10px; color: #94a3b8; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 8px;">JSON View</span>
               </div>
            </div>
            <div class="tabs-content" style="height: calc(100% - 35px);">
              <div id="tab-content-inspector" class="tab-pane active">
                <!-- Left sidebar from VisualizerUI will be moved here via JS -->
              </div>
              <div id="tab-content-json" class="tab-pane">
                <div id="editor-container"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Toast Notification Container -->
    <div id="toast" class="toast hidden">Copied to clipboard!</div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
